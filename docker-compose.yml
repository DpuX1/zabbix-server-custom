services:
  mysql:
    image: mysql:8.0
    container_name: zabbix-mysql
    environment:
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pass
      - MYSQL_ROOT_PASSWORD=root_pass
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      zabbix-net:
        ipv4_address: 172.19.0.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  zabbix-agent-mysql:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: zabbix-agent-mysql
    environment:
      - ZBX_HOSTNAME=mysql-agent
      - ZBX_SERVER_HOST=172.19.0.20
      - ZBX_SERVER_PORT=10051
      - ZBX_PLUGINS_MYSQL_DSN=tcp(mysql:3306)/zabbix?user=zabbix&password=zabbix_pass
    ports:
      - "10053:10050"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      zabbix-net:
        ipv4_address: 172.19.0.11

  zabbix-server:
    image: dpux1/zabbix-server-custom:7.0 
    container_name: zabbix-server
    environment:
      - DB_SERVER_HOST=mysql
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pass
      - ZBX_ALLOWUNSUPPORTEDDBVERSIONS=1
    ports:
      - "10051:10051"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      zabbix-net:
        ipv4_address: 172.19.0.20

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-7.0-latest
    container_name: zabbix-web
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=10051
      - DB_SERVER_HOST=mysql
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pass
      - PHP_TZ=Europe/Moscow
    ports:
      - "80:8080"
    restart: unless-stopped
    depends_on:
      - zabbix-server
    networks:
      zabbix-net:
        ipv4_address: 172.19.0.30

  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: zabbix-agent
    environment:
      - ZBX_HOSTNAME=zabbix-docker
      - ZBX_SERVER_HOST=172.19.0.20
      - ZBX_SERVER_PORT=10051
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "10054:10050"
    restart: unless-stopped
    depends_on:
      - zabbix-server
    networks:
      zabbix-net:
        ipv4_address: 172.19.0.40

networks:
  zabbix-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1
